# Rendered by Noctalia into $XDG_CACHE_HOME/noctalia/herdr/theme.toml.
# apply.sh splices this block into ~/.config/herdr/config.toml.
# Tokens: Herdr 0.8.0 CustomThemeColors (src/config/theme.rs).
# Base "terminal": unpainted chrome (sidebar empty cells) is Color::Reset and
# follows the host terminal default background. Do not add sidebar_bg /
# active_row_bg / selection_bg — 0.8.0's `herdr config check` rejects them.

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
accent = "{{ colors.primary.default.hex }}"
panel_bg = "{{ colors.surface.default.hex }}"
surface0 = "{{ colors.surface_container.default.hex }}"
surface1 = "{{ colors.surface_container_high.default.hex }}"
surface_dim = "{{ colors.surface_dim.default.hex }}"
overlay0 = "{{ colors.outline_variant.default.hex }}"
overlay1 = "{{ colors.outline.default.hex }}"
text = "{{ colors.on_surface.default.hex }}"
subtext0 = "{{ colors.on_surface_variant.default.hex }}"
mauve = "{{ colors.tertiary.default.hex }}"
green = "{{ colors.terminal_normal_green.default.hex }}"
yellow = "{{ colors.terminal_normal_yellow.default.hex }}"
red = "{{ colors.error.default.hex }}"
blue = "{{ colors.secondary.default.hex }}"
teal = "{{ colors.terminal_normal_cyan.default.hex }}"
peach = "{{ colors.tertiary_container.default.hex }}"
