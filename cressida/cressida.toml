version = 1
name = "Noctalia"
description = "Colors from the active Noctalia palette."
author = "Ly-sec"

# Both required variants follow the active Noctalia mode.
[dark]
background = "{{ colors.surface.default.hex }}"
sidebar = "{{ colors.surface_container_low.default.hex }}"
panel = "{{ colors.surface_container.default.hex }}"
raised = "{{ colors.surface_container_high.default.hex }}"
foreground = "{{ colors.on_surface.default.hex }}"
muted = "{{ colors.on_surface_variant.default.hex }}"
accent = "{{ colors.primary.default.hex }}"
ink = "{{ colors.on_primary.default.hex }}"
rail = "{{ colors.surface_container_lowest.default.hex }}"
danger = "{{ colors.error.default.hex }}"
destructive = "{{ colors.error.default.hex }}"
success = "{{ colors.terminal_normal_green.default.hex }}"
keyword = "{{ colors.terminal_normal_magenta.default.hex }}"
string = "{{ colors.terminal_normal_green.default.hex }}"
number = "{{ colors.terminal_normal_yellow.default.hex }}"
function = "{{ colors.terminal_normal_blue.default.hex }}"
type = "{{ colors.terminal_bright_blue.default.hex }}"
property = "{{ colors.terminal_normal_cyan.default.hex }}"
preprocessor = "{{ colors.secondary.default.hex }}"
added = "{{ colors.terminal_normal_green.default.hex }}"
removed = "{{ colors.terminal_normal_red.default.hex }}"
hover = "{{ colors.tertiary.default.hex }}"
on_hover = "{{ colors.on_tertiary.default.hex }}"

[light]
background = "{{ colors.surface.default.hex }}"
sidebar = "{{ colors.surface_container_low.default.hex }}"
panel = "{{ colors.surface_container.default.hex }}"
