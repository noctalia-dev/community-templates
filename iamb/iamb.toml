[theme.users]
colors = [
    "{{ colors.primary.default.hex }}",
    "{{ colors.secondary.default.hex }}",
    "{{ colors.tertiary.default.hex }}",
    "{{ colors.error.default.hex }}",
    "{{ colors.inverse_primary.default.hex }}",
    "{{ colors.primary_fixed.default.hex }}",
    "{{ colors.secondary_fixed.default.hex }}",
    "{{ colors.tertiary_fixed.default.hex }}",
]

[theme.default]
color = "{{ colors.on_surface.default.hex }}"
background = "{{ colors.surface.default.hex }}"

[theme.selected]
color = "{{ colors.primary_fixed_dim.default.hex }}"
background = "{{ colors.on_primary.default.hex }}"

[theme.completion]
default.background = "{{ colors.surface_container.default.hex }}"
default.color = "{{ colors.on_surface.default.hex }}"
selected.background = "{{ colors.primary_container.default.hex }}"
selected.color = "{{ colors.on_primary_container.default.hex }}"

[theme.timeline]
default.color = "{{ colors.on_surface.default.hex }}"
date.color = "{{ colors.secondary.default.hex }}"
time.color = "{{ colors.on_surface_variant.default.hex }}"
redacted.color = "{{ colors.on_surface_variant.default.hex }}"
unread_marker.color = "{{ colors.primary.default.hex }}"
state.color = "{{ colors.on_surface_variant.default.hex }}"
notice.color = "{{ colors.tertiary.default.hex }}"

[theme.messages]
default.color = "{{ colors.on_surface.default.hex }}"
code.color = "{{ colors.primary.default.hex }}"
code.background = "{{ colors.surface_container_high.default.hex }}"
code_block.background = "{{ colors.surface_container.default.hex }}"
emphasis.color = "{{ colors.secondary.default.hex }}"
strong.color = "{{ colors.tertiary.default.hex }}"
blockquote.color = "{{ colors.secondary.default.hex }}"
underlined.color = "{{ colors.primary.default.hex }}"
strikethrough.color = "{{ colors.on_surface_variant.default.hex }}"

[theme.rooms]
default.color = "{{ colors.on_surface.default.hex }}"
labels.color = "{{ colors.on_surface_variant.default.hex }}"
unread.name.color = "{{ colors.primary.default.hex }}"
unread.number.color = "{{ colors.on_primary_container.default.hex }}"
mention.number.color = "{{ colors.on_secondary_container.default.hex }}"
notification.number.color = "{{ colors.on_error_container.default.hex }}"
marked_unread.number.color = "{{ colors.on_tertiary_container.default.hex }}"

[theme.windows]
default.color = "{{ colors.on_surface.default.hex }}"
border.color = "{{ colors.outline_variant.default.hex }}"
border_focused.color = "{{ colors.primary.default.hex }}"
title.color = "{{ colors.primary.default.hex }}"

[theme.encryption]
icon_encrypted.color = "{{ colors.tertiary.default.hex }}"
icon_unencrypted.color = "{{ colors.outline.default.hex }}"
icon_unknown.color = "{{ colors.secondary.default.hex }}"

[theme.cmdbar]
default.color = "{{ colors.on_surface.default.hex }}"
default.background = "{{ colors.surface_container.default.hex }}"
error.color = "{{ colors.error.default.hex }}"
prompt.color = "{{ colors.primary.default.hex }}"
info.color = "{{ colors.tertiary.default.hex }}"

[theme.tabs]
title.color = "{{ colors.on_surface_variant.default.hex }}"
title_focused.color = "{{ colors.primary.default.hex }}"

[theme.msgbar]
default.color = "{{ colors.on_surface.default.hex }}"

