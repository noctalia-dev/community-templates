# Hermes Agent skin, rendered by Noctalia from the active palette.
# Lives at $HERMES_HOME/skins/noctalia.yaml — enable it with:
#     hermes config set display.skin noctalia
# `colors` follows Noctalia's default mode; the paired blocks are explicit so a
# light terminal under a dark Noctalia palette (and the reverse) stays coherent.
name: noctalia
description: Noctalia — colors of the active Noctalia palette, both polarities

colors:
  background: "{{ colors.background.default.hex }}"
  ui_accent: "{{ colors.primary.default.hex }}"
  banner_accent: "{{ colors.primary.default.hex }}"
  banner_title: "{{ colors.on_surface.default.hex }}"
  ui_primary: "{{ colors.on_surface.default.hex }}"
  banner_text: "{{ colors.on_surface.default.hex }}"
  ui_text: "{{ colors.on_surface.default.hex }}"
  ui_label: "{{ colors.on_surface_variant.default.hex }}"
  banner_dim: "{{ colors.on_surface_variant.default.hex }}"
  banner_border: "{{ colors.outline.default.hex }}"
  ui_border: "{{ colors.outline.default.hex }}"
  input_rule: "{{ colors.outline_variant.default.hex }}"
  response_border: "{{ colors.outline_variant.default.hex }}"
  ui_ok: "{{ colors.terminal_normal_green.default.hex }}"
  ui_warn: "{{ colors.terminal_normal_yellow.default.hex }}"
  ui_error: "{{ colors.error.default.hex }}"
  ui_tool: "{{ colors.tertiary.default.hex }}"
  ui_thinking: "{{ colors.on_surface_variant.default.hex }}"
  prompt: "{{ colors.primary.default.hex }}"
  status_bar_bg: "{{ colors.surface_container_lowest.default.hex }}"
  status_bar_text: "{{ colors.on_surface.default.hex }}"
  status_bar_good: "{{ colors.terminal_normal_green.default.hex }}"
  status_bar_warn: "{{ colors.terminal_normal_yellow.default.hex }}"
  status_bar_bad: "{{ colors.terminal_bright_red.default.hex }}"
  status_bar_critical: "{{ colors.error.default.hex }}"
  session_label: "{{ colors.primary.default.hex }}"
  session_border: "{{ colors.outline.default.hex }}"
  diff_added: "{{ colors.terminal_normal_green.default.hex | set_lightness 90 }}"
  diff_removed: "{{ colors.terminal_normal_red.default.hex | set_lightness 90 }}"
  diff_added_word: "{{ colors.terminal_normal_green.default.hex }}"
  diff_removed_word: "{{ colors.terminal_bright_red.default.hex }}"
  syntax_string: "{{ colors.terminal_normal_green.default.hex }}"
  syntax_number: "{{ colors.terminal_normal_yellow.default.hex }}"
  syntax_keyword: "{{ colors.primary.default.hex }}"
  syntax_comment: "{{ colors.on_surface_variant.default.hex }}"
  completion_menu_bg: "{{ colors.surface_container.default.hex }}"
  completion_menu_current_bg: "{{ colors.surface_container_high.default.hex }}"
  completion_menu_meta_bg: "{{ colors.surface_container_low.default.hex }}"

