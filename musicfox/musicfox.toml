error = "{{ colors.error.dark.hex }}"
info = "{{ colors.terminal_bright_blue.default.hex }}"
muted = "{{ colors.on_surface_variant.dark.hex }}"
hintKey = "{{ colors.outline.dark.hex }}"
background = "{{ colors.surface.dark.hex }}"
foreground = "{{ colors.on_surface.dark.hex }}"
border = "{{ colors.outline.dark.hex }}"
surface = "{{ colors.surface_container.dark.hex }}"

[dark.highlights]
