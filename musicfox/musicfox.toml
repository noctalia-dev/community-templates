# Noctalia — generated by the Noctalia theme engine from the active palette.
# Do not edit by hand; every Noctalia theme change overwrites this file.
name = "Noctalia"
description = "Noctalia desktop shell palette — synced from the active Noctalia theme"

# ── Dark Variant ───────────────────────────────────────────
[dark]
