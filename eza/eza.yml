colourful: true

# --- File Kinds ---
filekinds:
  normal:
    foreground: "{{ colors.on_surface.default.hex }}"
  directory:
    foreground: "{{ colors.primary.default.hex }}"
    is_bold: true
  symlink:
    foreground: "{{ colors.secondary.default.hex }}"
  pipe:
    foreground: "{{ colors.tertiary.default.hex }}"
  block_device:
    foreground: "{{ colors.tertiary_container.default.hex }}"
  char_device:
    foreground: "{{ colors.tertiary_container.default.hex }}"
  socket:
    foreground: "{{ colors.outline.default.hex }}"
  special:
    foreground: "{{ colors.error.default.hex }}"
  executable:
    foreground: "{{ colors.primary_container.default.hex }}"
    is_bold: true
  mount_point:
    foreground: "{{ colors.secondary_container.default.hex }}"
    is_underline: true

# --- File Types & Categories ---
file_type:
  image:
    foreground: "{{ colors.tertiary.default.hex }}"
  video:
    foreground: "{{ colors.tertiary.default.hex }}"
    is_bold: true
  music:
    foreground: "{{ colors.secondary.default.hex }}"
  crypto:
    foreground: "{{ colors.primary.default.hex }}"
  document:
    foreground: "{{ colors.on_surface_variant.default.hex }}"
  compressed:
    foreground: "{{ colors.error.default.hex }}"
  temp:
    foreground: "{{ colors.outline.default.hex }}"
    is_dimmed: true
  compiled:
    foreground: "{{ colors.outline_variant.default.hex }}"
    is_dimmed: true
  build:
    foreground: "{{ colors.primary_fixed.default.hex }}"
    is_underline: true
  source:
    foreground: "{{ colors.primary.default.hex }}"

# --- File Permissions ---
perms:
  user_read:
    foreground: "{{ colors.on_surface.default.hex }}"
  user_write:
    foreground: "{{ colors.error.default.hex }}"
  user_execute_file:
    foreground: "{{ colors.primary.default.hex }}"
    is_bold: true
  user_execute_other:
    foreground: "{{ colors.primary.default.hex }}"
  group_read:
    foreground: "{{ colors.on_surface_variant.default.hex }}"
  group_write:
    foreground: "{{ colors.error_container.default.hex }}"
  group_execute:
    foreground: "{{ colors.secondary.default.hex }}"
  other_read:
    foreground: "{{ colors.outline.default.hex }}"
  other_write:
    foreground: "{{ colors.error_container.default.hex }}"
  other_execute:
    foreground: "{{ colors.outline.default.hex }}"
  special_user_file:
    foreground: "{{ colors.tertiary.default.hex }}"
  special_other:
    foreground: "{{ colors.tertiary_container.default.hex }}"
  attribute:
    foreground: "{{ colors.outline_variant.default.hex }}"

# --- File Size ---
size:
  number_byte:
    foreground: "{{ colors.on_surface_variant.default.hex }}"
  number_kilo:
    foreground: "{{ colors.on_surface.default.hex }}"
  number_mega:
    foreground: "{{ colors.primary.default.hex }}"
  number_giga:
    foreground: "{{ colors.secondary.default.hex }}"
  number_huge:
    foreground: "{{ colors.tertiary.default.hex }}"
  unit_byte:
    foreground: "{{ colors.outline.default.hex }}"
  unit_kilo:
    foreground: "{{ colors.on_surface_variant.default.hex }}"
  unit_mega:
    foreground: "{{ colors.primary.default.hex }}"
  unit_giga:
    foreground: "{{ colors.secondary.default.hex }}"
  unit_huge:
    foreground: "{{ colors.tertiary.default.hex }}"

# --- Users & Groups ---
users:
  user_you:
    foreground: "{{ colors.primary.default.hex }}"
    is_bold: true
  user_root:
    foreground: "{{ colors.error.default.hex }}"
    is_bold: true
  user_other:
    foreground: "{{ colors.outline.default.hex }}"
  group_yours:
    foreground: "{{ colors.secondary.default.hex }}"
  group_root:
    foreground: "{{ colors.error_container.default.hex }}"
  group_other:
    foreground: "{{ colors.outline.default.hex }}"

# --- Git Status ---
git:
  new:
    foreground: "{{ colors.tertiary.default.hex }}"
  modified:
    foreground: "{{ colors.secondary.default.hex }}"
  deleted:
    foreground: "{{ colors.error.default.hex }}"
  renamed:
    foreground: "{{ colors.primary.default.hex }}"
  ignored:
    foreground: "{{ colors.outline.default.hex }}"
    is_dimmed: true
  conflicted:
    foreground: "{{ colors.error.default.hex }}"
    is_bold: true

# --- Git Repository ---
git_repo:
  branch_main:
    foreground: "{{ colors.primary.default.hex }}"
    is_bold: true
  branch_other:
    foreground: "{{ colors.secondary.default.hex }}"
  git_clean:
    foreground: "{{ colors.tertiary.default.hex }}"
  git_dirty:
    foreground: "{{ colors.error.default.hex }}"

# --- UI & Meta Elements ---
punctuation:
  foreground: "{{ colors.outline.default.hex }}"

date:
  foreground: "{{ colors.on_surface_variant.default.hex }}"

header:
  foreground: "{{ colors.on_surface.default.hex }}"
  is_bold: true
  is_underline: true

inode:
  foreground: "{{ colors.outline_variant.default.hex }}"

blocks:
  foreground: "{{ colors.outline_variant.default.hex }}"

octal:
  foreground: "{{ colors.secondary.default.hex }}"

broken_symlink:
  foreground: "{{ colors.error.default.hex }}"
  is_bold: true

broken_path_overlay:
  foreground: "{{ colors.on_error.default.hex }}"
  background: "{{ colors.error.default.hex }}"
