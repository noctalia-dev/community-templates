# HyprFM theme generated by Noctalia. Do not edit: it is rewritten on every
# theme change.
#
#   base     file view background        text     primary text
#   mantle   toolbar, dialogs            subtext  secondary text
#   crust    title bar, sidebar          muted    icons, disabled text
#   surface  cards, inputs, hovered rows accent   selection, focus ring, links
#   overlay  borders, separators

[colors]
base    = "{{colors.surface.default.hex}}"
mantle  = "{{colors.surface_container_low.default.hex}}"
crust   = "{{colors.surface_container.default.hex}}"
surface = "{{colors.surface_container_highest.default.hex}}"
overlay = "{{colors.outline_variant.default.hex}}"
text    = "{{colors.on_surface.default.hex}}"
subtext = "{{colors.on_surface_variant.default.hex}}"
muted   = "{{colors.outline.default.hex}}"
accent  = "{{colors.primary.default.hex}}"
success = "{{colors.secondary.default.hex}}"
warning = "{{colors.tertiary.default.hex}}"
error   = "{{colors.error.default.hex}}"

# ANSI colours 0-15 of the built-in terminal (F4).
[terminal]
palette = [
    "{{colors.terminal_normal_black.default.hex}}", "{{colors.terminal_normal_red.default.hex}}", "{{colors.terminal_normal_green.default.hex}}", "{{colors.terminal_normal_yellow.default.hex}}",
    "{{colors.terminal_normal_blue.default.hex}}", "{{colors.terminal_normal_magenta.default.hex}}", "{{colors.terminal_normal_cyan.default.hex}}", "{{colors.terminal_normal_white.default.hex}}",
    "{{colors.terminal_bright_black.default.hex}}", "{{colors.terminal_bright_red.default.hex}}", "{{colors.terminal_bright_green.default.hex}}", "{{colors.terminal_bright_yellow.default.hex}}",
    "{{colors.terminal_bright_blue.default.hex}}", "{{colors.terminal_bright_magenta.default.hex}}", "{{colors.terminal_bright_cyan.default.hex}}", "{{colors.terminal_bright_white.default.hex}}",
]
